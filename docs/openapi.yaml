
openapi: 3.0.3

info:
  title: Import / Export API
  version: 1.0.0
  description: API импорта XLSX и управления каталогом товаров.

servers:
  - url: http://localhost:8080/api
    description: Backend API

tags:
  - name: Products
    description: Каталог товаров
  - name: Import
    description: Импорт XLSX

paths:
  /products:
    get:
      tags:
        - Products
      summary: Получить список товаров
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: name
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Список товаров с пагинацией
          content:
            application/json:
              schema:
                type: object

  /products/{id}:
    get:
      tags:
        - Products
      summary: Получить товар по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о товаре
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Товар не найден

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: integer
        external_code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        discount:
          type: number
        images:
          type: array
          items:
            type: object
        attributes:
          type: array
          items:
            type: object
