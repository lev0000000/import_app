<form
  action="#"
  class="flex w-full flex-col gap-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm sm:p-8"
  method="post"
  (submit)="onSubmit($event)"
>
  <div class="space-y-2">
    <h2 class="text-2xl font-semibold text-gray-900">Импорт товаров</h2>

    <p class="text-sm text-gray-500">Выберите XLSX-файл для загрузки товаров</p>
  </div>

  <div class="space-y-2">
    <label for="file" class="block text-sm font-medium text-gray-700"> Файл импорта </label>
    <input
      id="file"
      type="file"
      accept=".xlsx"
      name="file"
      (change)="onFileSelected($event)"
      class="block w-full cursor-pointer rounded-xl border border-gray-300 bg-gray-50 p-3 text-sm text-gray-700 file:mr-4 file:rounded-lg file:border-0 file:bg-blue-50 file:px-4 file:py-2 file:font-medium file:text-blue-700 hover:file:bg-blue-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
    />
  </div>

  <button
    type="submit"
    class="w-full cursor-pointer rounded-xl bg-blue-600 px-6 py-3 font-medium text-white transition-colors hover:bg-blue-700 active:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 sm:w-fit"
  >
    Импортировать
  </button>
</form>
