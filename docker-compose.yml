services:

  init-permissions:
    image: alpine:3.21
    user: root
    volumes:
      - ./server/uploads:/uploads
      - ./server/logs:/logs
    command: >
      sh -c "mkdir -p /uploads/imports /uploads/img /logs &&
             chown -R 33:33 /uploads /logs &&
             chmod -R 775 /uploads /logs"
    restart: "no"

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: slim_php
    working_dir: /var/www/html

    volumes:
      - ./server:/var/www/html

    expose:
      - "9000"

    env_file:
      - ./.env

    depends_on:
      init-permissions:
        condition: service_completed_successfully

  queue-consumer:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: slim_queue_consumer
    working_dir: /var/www/html

    volumes:
      - ./server:/var/www/html

    command: php bin/import-consumer.php
    restart: unless-stopped

    depends_on:
      init-permissions:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started

    env_file:
      - ./.env



  nginx:
    image: nginx:stable-alpine
    container_name: slim_nginx
    ports:
      - "8080:80"

    volumes:
      - ./server:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

  db:
    image: mysql:8.4
    container_name: slim_mysql
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: slim_rabbitmq
    restart: unless-stopped

    ports:
      - "5671:5672"
      - "15671:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  swagger:
    image: swaggerapi/swagger-ui:latest
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs/openapi.yaml:/docs/openapi.yaml:ro
    restart: unless-stopped  

volumes:
  mysql_data:
  rabbitmq_data:

